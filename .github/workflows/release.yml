name: release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: docker
    container:
      image: git.lab.bit2lab.com/valhalla/groovy4-jdk17:latest
    environment: release
    env:
      ORG_GRADLE_PROJECT_PUBLISH_SIGN_KEY_ID: ${{ secrets.ORG_GRADLE_PROJECT_PUBLISH_SIGN_KEY_ID }}
      ORG_GRADLE_PROJECT_PUBLISH_SIGN_KEY: ${{ secrets.ORG_GRADLE_PROJECT_PUBLISH_SIGN_KEY }}
      ORG_GRADLE_PROJECT_PUBLISH_SIGN_SECRET: ${{ secrets.ORG_GRADLE_PROJECT_PUBLISH_SIGN_SECRET }}
      ORG_GRADLE_PROJECT_PUBLISH_GH_TOKEN: ${{ secrets.ORG_GRADLE_PROJECT_PUBLISH_GH_TOKEN }}
      ORG_GRADLE_PROJECT_PUBLISH_REPO_USERNAME: ${{ secrets.ORG_GRADLE_PROJECT_PUBLISH_REPO_USERNAME }}
      ORG_GRADLE_PROJECT_PUBLISH_REPO_PASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_PUBLISH_REPO_PASSWORD }}
      CI: true
    steps:
      - uses: actions/checkout@v4
#      - name: Install uv
#        uses: astral-sh/setup-uv@v7
#      - name: Set up Python
#        run: uv python install
#      - name: building docs
#        working-directory: docs/guide
#        run: uv sync && uv run mkdocs build

#      - uses: actions/setup-java@v4
#        with:
#          distribution: 'corretto'
#          java-version: '17'

      - name: release
        run: ./gradlew --stacktrace build
#        run: ./gradlew --stacktrace build publish
#        run: ./gradlew --stacktrace build gitPublishPush
  docs:
    runs-on: docker
    needs:
      - build
    env:
      DOCKER_HOST: tcp://127.0.0.1:2376
      DOCKER_TLS_VERIFY: 1
      DOCKER_CERT_PATH: /certs/client
      IMAGE_REPOSITORY: git.lab.bit2lab.com/underdog
    container:
      image: git.lab.bit2lab.com/valhalla/base:latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: docs
        run: |
          docker login git.lab.bit2lab.com \
            --username ${{ secrets.DOCKER_USERNAME }} \
            --password ${{ secrets.DOCKER_PASSWORD }}
          docker buildx build -f docs/guide/Dockerfile -t $IMAGE_REPOSITORY/underdog-site:latest docs/guide
          docker push $IMAGE_REPOSITORY/underdog-site:latest